# SOC stack — the whole NON-Pixie environment for the e2e / calibration suite.
#
# `skaffold deploy -m soc-stack` brings up ClickHouse -> kubescape (in that
# order) on k3s. node-agent alerts reach ClickHouse and dx over node-agent's
# direct stream, which dx-daemon consumes; there is no log shipper. It is designed to be OVERLAID with:
#   - Pixie's native Skaffold (the `pl` namespace: vizier + adaptive_export), and
#   - the bob java-poc apps Skaffold (bob/example/java-poc, the sample workloads).
#
# Ownership: this repo owns honey (kubescape/dx wiring) + clickhouse. It
# does NOT own `pl` (Pixie) or the sample apps (bob) — those compose on top.
#
# k3s only for now. Everything references the authoritative in-repo configs
# (tree/clickhouse-lab, tree/kubescape) — no forked copies.
# ---------------------------------------------------------------------------
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: soc-clickhouse
# skaffold stamps a fresh skaffold.dev/run-id on what it deploys. On a pod
# template that is a template change, so an unchanged tree rolled every pod on
# every deploy. Denied here so a repeated deploy changes nothing; a new image
# or config still rolls.
resourceSelector:
  deny:
    - groupKind: DaemonSet.apps
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: Deployment.apps
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: StatefulSet.apps
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: Job.batch
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: Service
      labels: [".metadata.labels"]
manifests:
  helm:
    releases:
      - name: clickhouse-operator
        repo: https://helm.altinity.com
        remoteChart: altinity-clickhouse-operator
        version: 0.26.0
        namespace: clickhouse
        createNamespace: true
  rawYaml:
    - tree/clickhouse-lab/keeper.yaml
    - tree/clickhouse-lab/installation.yaml
deploy:
  helm: {}
  kubectl:
    # Server-side apply: the altinity operator ships a CRD bundle whose ConfigMap
    # exceeds the 262144-byte client-side last-applied-configuration annotation
    # limit. SSA stores no such annotation; --force-conflicts takes field
    # ownership from helm's manager on reconcile.
    flags:
      apply: ["--server-side", "--force-conflicts"]
    # After the ClickHouseInstallation CR is applied, wait for the server pod and
    # load the forensic_db schema (nanosecond timestamps, #227). Mirrors
    # tree/clickhouse-lab/install.sh. Uses `kubectl wait` (server-side) so there
    # is no host sleep.
    hooks:
      after:
        - host:
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                NS=clickhouse; CHI=forensic-soc-db
                kubectl -n "$NS" wait --for=create pod -l clickhouse.altinity.com/chi=$CHI --timeout=120s
                kubectl -n "$NS" wait --for=condition=Ready pod -l clickhouse.altinity.com/chi=$CHI --timeout=240s
                P=$(kubectl -n "$NS" get pods -l clickhouse.altinity.com/chi=$CHI -o jsonpath='{.items[0].metadata.name}')
                kubectl -n "$NS" exec -i "$P" -- clickhouse-client --multiquery < tree/clickhouse-lab/schema.sql
                echo "forensic_db schema applied"
            os: [linux, darwin]
        # Assert the operator actually RENDERED what the CRs ask for. An Altinity
        # template that is defined but not referenced is discarded silently: the CR
        # reads as correct while the StatefulSet runs a different image, no
        # resources and no PVC. This compares desired (CR podTemplate) against
        # rendered (StatefulSet) for both server and keeper, with no version
        # hardcoded here, so it keeps working when the pins change.
        - host:
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                NS=clickhouse; CHI=forensic-soc-db; CHK=forensic-keeper; rc=0
                kubectl -n "$NS" wait --for=create sts -l clickhouse-keeper.altinity.com/chk=$CHK --timeout=120s >/dev/null 2>&1 || true
                check() {
                  local what=$1 want=$2 got=$3
                  if [ -z "$want" ]; then echo "  $what: no podTemplate image in CR, skipped"; return 0; fi
                  if [ -z "$got" ]; then echo "  $what: MISSING StatefulSet"; return 1; fi
                  if [ "$want" != "$got" ]; then
                    echo "  $what: MISMATCH"; echo "    CR asks for : $want"; echo "    rendered    : $got"; return 1
                  fi
                  echo "  $what: ok ($got)"; return 0
                }
                WS=$(kubectl -n "$NS" get chi $CHI -o jsonpath='{.spec.templates.podTemplates[0].spec.containers[0].image}' 2>/dev/null || true)
                GS=$(kubectl -n "$NS" get sts -l clickhouse.altinity.com/chi=$CHI -o jsonpath='{.items[0].spec.template.spec.containers[0].image}' 2>/dev/null || true)
                WK=$(kubectl -n "$NS" get chk $CHK -o jsonpath='{.spec.templates.podTemplates[0].spec.containers[0].image}' 2>/dev/null || true)
                GK=$(kubectl -n "$NS" get sts -l clickhouse-keeper.altinity.com/chk=$CHK -o jsonpath='{.items[0].spec.template.spec.containers[0].image}' 2>/dev/null || true)
                echo "verifying rendered images match the CRs:"
                check server "$WS" "$GS" || rc=1
                check keeper "$WK" "$GK" || rc=1
                if [ $rc -ne 0 ]; then
                  echo "ERROR: the operator discarded a template."
                  echo "An EXISTING StatefulSet is not corrected by adding the templates binding —"
                  echo "recreate it:  kubectl -n $NS delete chk $CHK  &&  skaffold deploy -m soc-stack"
                  exit 1
                fi
            os: [linux, darwin]
---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: soc-kubescape
# skaffold stamps a fresh skaffold.dev/run-id on what it deploys. On a pod
# template that is a template change, so an unchanged tree rolled every pod on
# every deploy. Denied here so a repeated deploy changes nothing; a new image
# or config still rolls.
resourceSelector:
  deny:
    - groupKind: DaemonSet.apps
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: Deployment.apps
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: StatefulSet.apps
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: Job.batch
      labels: [".spec.template.metadata.labels", ".metadata.labels"]
    - groupKind: Service
      labels: [".metadata.labels"]
manifests:
  helm:
    releases:
      - name: kubescape
        remoteChart: https://github.com/k8sstormcenter/helm-charts/releases/download/kubescape-operator-1.41.0-duckling64/kubescape-operator-1.41.0-duckling64.tgz
        namespace: honey
        createNamespace: true
        valuesFiles:
          - tree/kubescape/values.yaml
  rawYaml:
    # soc owns the runtime rule set + binding (helm's alertCRD.installDefault is
    # false in values.yaml), so our enabled flags win instead of racing helm.
    - tree/kubescape/default-rules.yaml
    - tree/kubescape/rule-alert-binding.yaml
profiles:
  # Standalone consumers (bob's demos) have no ClickHouse/dx path, so the
  # alerts have to reach an Alertmanager or nothing observes them.
  - name: standalone
    patches:
      - op: add
        path: /manifests/helm/releases/0/valuesFiles/-
        value: tree/kubescape/values-standalone.yaml
deploy:
  helm:
    hooks:
      # node-agent mounts the verifier key at start, so the pair must exist
      # before the release installs. Create-if-absent: a no-op on a second run.
      before:
        - host:
            command: ["sh", "-c", "kubectl create ns honey --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1; NS=honey sh tree/kubescape/ensure-direct-jwt.sh && sh tree/kubescape/keep-rules-on-handover.sh"]
            os: [linux, darwin]
      # Retire a vector left from before the direct stream (no-op once gone).
      # Only after node-agent has rolled onto the direct stream, so alerts are
      # briefly written twice rather than lost.
      after:
        - host:
            command: ["sh", "tree/kubescape/retire-vector.sh"]
            os: [linux, darwin]
  kubectl:
    flags:
      apply: ["--server-side", "--force-conflicts"]
    hooks:
      before:
        - host:
            command: ["sh", "-c", "kubectl create ns honey --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1; kubectl create secret docker-registry duckling-pull -n honey --from-file=.dockerconfigjson=$HOME/.docker/config.json --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1 || true"]
            os: [linux, darwin]
      # No node-agent restart: its rules watcher picks up the rawYaml rules live.
---
# Entry point: `skaffold deploy -m soc-stack` deploys clickhouse -> kubescape.
# soc-kubescape is standalone — `skaffold deploy -m soc-kubescape` brings
# up the detection stack alone, for consumers that do not want the forensic store
# (add -p standalone to point node-agent at an Alertmanager).
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: soc-stack
requires:
  - configs: [soc-clickhouse, soc-kubescape]
