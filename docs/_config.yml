title: Kubernetes StormCenter
description: >-
  Find runtime threats in Kubernetes and store only the evidence.
  User documentation for github.com/k8sstormcenter/soc.

# Built by GitHub Pages from the docs/ folder of main.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: https://k8sstormcenter.github.io
baseurl: /soc

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "soc on GitHub": https://github.com/k8sstormcenter/soc
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/k8sstormcenter/soc
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

exclude:
  - README.md
