# duckling node-agent is a private image (docker.io/entlein/duckling) — the
# deploy must create the duckling-pull secret in honey before the node-agent
# schedules (docker login -u entlein first). See Makefile/skaffold pull-secret step.
imagePullSecrets: duckling-pull
storage:
  image:
    repository: ghcr.io/k8sstormcenter/storage
    tag: rc-rogue5
nodeAgent:
  image:
    repository: docker.io/entlein/duckling
    tag: v0.1.0-rogue8
    pullPolicy: Always
  config:
    alertManagerExporterUrls:
      - alertmanager.honey.svc.cluster.local:9093
    maxLearningPeriod: 24h
    learningPeriod: 10m
    updatePeriod: 10000m
    networkServiceResolution: true
    # Cooldown is OFF on purpose: every rule hit is emitted so a measurement
    # run counts what the sensor actually produces rather than what it reports
    # after suppression. Code defaults are 1h / count 1 (node-agent
    # pkg/config).
    #
    # It is also the volume multiplier behind every downstream memory finding.
    # A cluster lost its control-plane node after a day of ~3200 alerts/hour:
    # each alert is a synchronous exporter round-trip, a vector event, a CH
    # row and a dx referral, and the export path leaks one connection per
    # capture it triggers. Cooldown is what bounds a slow permanent stream; a
    # burst ceiling does not, because such a stream sits below any ceiling
    # that would not also suppress legitimate bursts. The real fix for a
    # stream is to correct the classification that produces it.
    #
    # Turn it back on (1h / count 1) for any cluster that is not being
    # measured.
    ruleCooldown:
      ruleCooldownDuration: 0h
      ruleCooldownAfterCount: 1000000000
      ruleCooldownOnProfileFailure: false
      ruleCooldownMaxSize: 20000
capabilities:
  runtimeDetection: enable
  configurationScan: disable
  nodeScan: disable
  nodeSbomGeneration: disable
  vulnerabilityScan: disable
  relevancy: disable
  admissionController: disable
  # disable: soc runs OFFLINE (no kubescape cloud backend, .Values.server empty), so
  # the operator renders networkStreamingEnabled=FALSE no matter what this says — it
  # even emits a capabilityWarning to that effect. So this is a NO-OP for detection
  # (DNS/network events reach the rule engine via the always-on paths; R0005/R0011
  # fire regardless). Leaving it "enable" only makes node-agent try to init a stream
  # http exporter with no URL -> "InitExporters: URL is required" warning every boot.
  # disable stops that useless init and keeps the node-agent log clean. Verified on
  # rig 6a749a2b via operator regen + full bobctl attack.
  networkEventsStreaming: disable
alertCRD:
  # false: soc deploys via skaffold (unordered helm/kubectl apply), so the chart's
  # own upstream ap.*/nn.* default rules would race and WIN over soc's cp.* rawYaml
  # rules against the new cp.* node-agent -> "undeclared reference to 'ap'" and zero
  # detections. soc owns default-rules.yaml + rule-alert-binding.yaml via rawYaml.
  installDefault: false
  scopeClustered: true
clusterName: bobexample
ksNamespace: honey
excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,local-path-storage,gmp-system,gmp-public,storm,lightening,cert-manager,kube-flannel,ingress-nginx,honey,clickhouse,chain-loadgen"
