# soc applies the rendered chart with kubectl, so helm's lookup never sees the
# live secrets and the default "template" strategy mints new storage TLS on
# every deploy. initContainer: certgen owns the material in-cluster.
certificates:
  strategy: initContainer
nodeAgent:
  env:
    - name: NodeName
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: ENABLE_PROFILER
      value: "1"
  directAlerts:
    enabled: true
    port: 50405
    jwtPublicKeySecret: node-agent-direct-jwt-pub
    # The keypair is minted by tree/kubescape/ensure-direct-jwt.sh (skaffold
    # before-hook), not by the chart's keygen Job.
    keygen:
      enabled: false
  config:
    # Nothing in soc-stack deploys Alertmanager. With a URL set, every rule hit
    # is also a failed POST (DNS: no such host) logged at warn — one per alert.
    # The path that feeds ClickHouse is stdoutExporter -> vector, chart default.
    alertManagerExporterUrls: []
    maxLearningPeriod: 24h
    learningPeriod: 10m
    updatePeriod: 10000m
capabilities:
  runtimeDetection: enable
  hostProfileService: enable
  nodeSbomGeneration: disable
  admissionController: disable
alertCRD:
  # false: soc deploys via skaffold (unordered helm/kubectl apply), so the chart's
  # own upstream ap.*/nn.* default rules would race and WIN over soc's cp.* rawYaml
  # rules against the new cp.* node-agent -> "undeclared reference to 'ap'" and zero
  # detections. soc owns default-rules.yaml + rule-alert-binding.yaml via rawYaml.
  installDefault: false
  scopeClustered: true
imagePullSecrets: duckling-pull
clusterName: bobexample
ksNamespace: honey
excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,local-path-storage,gmp-system,gmp-public,storm,lightening,cert-manager,kube-flannel,ingress-nginx,honey,clickhouse,chain-loadgen,pl,olm,px-operator,tailscale-system,traefik,cilium-secrets,external-dns"

storage:
  env:
    - name: ENABLE_PROFILER
      value: "1"
